<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Visualizer — Interactive Code Execution Canvas</title>
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/nodes.css">
  <link rel="stylesheet" href="css/arrows.css">
  <style>
    /* ===== Global Reset & Theme ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-panel: #1e293b;
      --bg-editor: #0f172a;
      --border: #334155;
      --border-active: #6366f1;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-dark: #4338ca;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Courier New', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* ===== App Layout ===== */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* ===== Top Bar ===== */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo svg {
      width: 28px;
      height: 28px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--accent-light);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== Main Workspace ===== */
    #workspace {
      display: grid;
      grid-template-columns: 420px 1fr;
      overflow: hidden;
    }

    /* ===== Resizer Handle ===== */
    #resizer {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 5px;
      cursor: col-resize;
      background: transparent;
      z-index: 50;
      transition: background 0.15s;
    }
    #resizer:hover, #resizer.active {
      background: var(--accent);
    }

    /* ===== Left Panel: Code Editor + Controls ===== */
    #left-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      min-width: 300px;
    }

    /* Editor Area */
    #editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .editor-header-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .editor-lang-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1e3a5f;
      color: #38bdf8;
      border: 1px solid #0ea5e9;
    }

    #editor-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Line Numbers */
    #line-numbers {
      width: 44px;
      padding: 12px 6px 12px 0;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      background: var(--bg-editor);
      border-right: 1px solid var(--border);
      overflow: hidden;
      user-select: none;
      flex-shrink: 0;
    }

    .line-number {
      height: 20.8px; /* matches line-height */
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
    }

    .line-number.active-line {
      background: rgba(99, 102, 241, 0.2);
      color: var(--accent-light);
      font-weight: 700;
      border-right: 2px solid var(--accent);
    }

    /* Code Textarea */
    #code-editor {
      flex: 1;
      width: 100%;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--bg-editor);
      border: none;
      outline: none;
      resize: none;
      overflow: auto;
      tab-size: 4;
      white-space: pre;
    }

    #code-editor::placeholder {
      color: var(--text-muted);
    }

    /* ===== Step Controls ===== */
    #step-controls {
      padding: 10px 12px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 34px;
      padding: 0 12px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      user-select: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: #334155;
      border-color: var(--accent);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-run {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: white;
    }

    .btn-run:hover {
      background: var(--accent);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    .btn-danger {
      border-color: var(--error);
      color: #fca5a5;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    /* Slider */
    #step-slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #step-slider {
      flex: 1;
      appearance: none;
      -webkit-appearance: none;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
    }

    #step-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--accent-light);
      box-shadow: 0 0 6px rgba(99, 102, 241, 0.5);
    }

    #step-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--accent-light);
    }

    .step-info {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      min-width: 110px;
      text-align: right;
    }

    /* ===== Stdout Panel ===== */
    #stdout-panel {
      border-top: 1px solid var(--border);
      background: var(--bg-editor);
      max-height: 120px;
      overflow-y: auto;
    }

    .stdout-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }

    .stdout-header:hover {
      background: #243248;
    }

    .stdout-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stdout-toggle {
      font-size: 10px;
      color: var(--text-muted);
    }

    #stdout-content {
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: #34d399;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 20px;
    }

    /* ===== Right Panel: Canvas ===== */
    #right-panel {
      position: relative;
      overflow: hidden;
    }

    /* ===== Bottom Status Bar ===== */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      z-index: 100;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: var(--error);
      animation: none;
    }

    .status-dot.idle {
      background: var(--text-muted);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== Error Banner ===== */
    #error-banner {
      display: none;
      padding: 10px 16px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      margin: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #fca5a5;
    }

    #error-banner.visible {
      display: block;
    }

    /* ===== Loading Overlay ===== */
    #loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    #loading-overlay.visible {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== Keyboard Shortcuts Help ===== */
    #shortcuts-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
    }

    #shortcuts-modal.visible {
      display: flex;
    }

    .shortcuts-content {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 32px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .shortcuts-content h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .shortcut-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }

    .shortcut-key {
      font-family: var(--font-mono);
      background: var(--bg-editor);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--accent-light);
      font-size: 12px;
    }

    .shortcut-desc {
      color: var(--text-secondary);
    }

    /* ===== Example Selector ===== */
    #example-select {
      height: 30px;
      padding: 0 8px;
      font-family: var(--font-sans);
      font-size: 12px;
      background: var(--bg-panel);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    #example-select:hover {
      border-color: var(--accent);
    }

    /* ===== Speed Control ===== */
    .speed-control {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    #speed-select {
      height: 26px;
      padding: 0 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--bg-editor);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ===== Top Bar ===== -->
    <header id="top-bar">
      <div class="logo">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="13" stroke="#6366f1" stroke-width="2"/>
          <path d="M9 10l5-3 5 3v8l-5 3-5-3z" fill="#4338ca"/>
          <circle cx="14" cy="14" r="3" fill="#818cf8"/>
        </svg>
        <span class="logo-text">Python<span>Visualizer</span></span>
      </div>
      <div class="top-actions">
        <select id="example-select">
          <option value="">📂 Load Example...</option>
          <option value="linked-list-swap">Linked List SwapPairs</option>
          <option value="binary-search">Binary Search</option>
          <option value="fibonacci">Fibonacci (Recursive)</option>
          <option value="stack-operations">Stack Operations</option>
          <option value="dict-example">Dictionary Example</option>
          <option value="class-hierarchy">Class Hierarchy</option>
          <option value="list-comprehension">List Manipulation</option>
        </select>
        <button class="btn" id="btn-shortcuts" title="Keyboard Shortcuts">⌨️</button>
        <button class="btn" id="btn-theme" title="Toggle Theme Info">🎨</button>
      </div>
    </header>

    <!-- ===== Main Workspace ===== -->
    <div id="workspace">
      <!-- Left Panel: Editor + Controls -->
      <div id="left-panel">
        <div id="editor-area">
          <div class="editor-header">
            <span class="editor-header-title">📝 Code Editor</span>
            <span class="editor-lang-badge">Python 3</span>
          </div>
          <div id="editor-wrapper">
            <div id="line-numbers"></div>
            <textarea id="code-editor" spellcheck="false" placeholder="# Write your Python code here...&#10;# Press Ctrl+Enter to run&#10;&#10;"></textarea>
          </div>
          <div id="error-banner"></div>
        </div>

        <!-- Step Controls -->
        <div id="step-controls">
          <div class="controls-row">
            <button class="btn btn-run" id="btn-run" title="Run Code (Ctrl+Enter)">▶ Run</button>
            <button class="btn" id="btn-prev" disabled title="Previous Step (←)">⏮ Prev</button>
            <button class="btn" id="btn-next" disabled title="Next Step (→)">Next ⏭</button>
            <button class="btn" id="btn-first" disabled title="First Step (Home)">⏪ First</button>
            <button class="btn" id="btn-last" disabled title="Last Step (End)">Last ⏩</button>
            <button class="btn btn-danger" id="btn-reset" title="Reset (Ctrl+R)">↻ Reset</button>
          </div>
          <div id="step-slider-container">
            <input type="range" id="step-slider" min="0" max="0" value="0" disabled>
            <span class="step-info" id="step-info">Step 0 / 0</span>
          </div>
          <div class="controls-row">
            <button class="btn" id="btn-autoplay" disabled title="Auto-Play / Pause">⏯ Auto-Play</button>
            <div class="speed-control">
              <span>Speed:</span>
              <select id="speed-select">
                <option value="2000">0.5×</option>
                <option value="1000" selected>1×</option>
                <option value="500">2×</option>
                <option value="250">4×</option>
                <option value="100">10×</option>
              </select>
            </div>
            <button class="btn" id="btn-fit" disabled title="Fit to View">🔲 Fit</button>
            <button class="btn" id="btn-realign" disabled title="Re-align Layout">📐 Tidy</button>
          </div>
        </div>

        <!-- Stdout Panel -->
        <div id="stdout-panel">
          <div class="stdout-header" id="stdout-header">
            <span class="stdout-title">📤 Output (stdout)</span>
            <span class="stdout-toggle">▼</span>
          </div>
          <div id="stdout-content">No output yet.</div>
        </div>
      </div>

      <!-- Resizer -->
      <div id="resizer"></div>

      <!-- Right Panel: Interactive Canvas -->
      <div id="right-panel">
        <div id="canvas-viewport">
          <div id="canvas-world">
            <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="nodes-layer"></div>
          </div>
        </div>

        <!-- Canvas Toolbar -->
        <div class="canvas-toolbar">
          <button id="btn-zoom-in" title="Zoom In">+</button>
          <button id="btn-zoom-out" title="Zoom Out">−</button>
          <button id="btn-zoom-reset" title="Reset Zoom">1:1</button>
          <button id="btn-fit-canvas" class="btn-primary" title="Fit to View">Fit</button>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- ===== Status Bar ===== -->
    <footer id="status-bar">
      <div class="status-left">
        <span class="status-indicator">
          <span class="status-dot idle" id="status-dot"></span>
          <span id="status-text">Ready</span>
        </span>
        <span id="status-event"></span>
      </div>
      <span id="status-line">Line: —</span>
    </footer>
  </div>

  <!-- Shortcuts Modal -->
  <div id="shortcuts-modal">
    <div class="shortcuts-content">
      <h3>⌨️ Keyboard Shortcuts</h3>
      <div class="shortcut-row"><span class="shortcut-desc">Run Code</span><span class="shortcut-key">Ctrl+Enter</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">Previous Step</span><span class="shortcut-key">← / A</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">Next Step</span><span class="shortcut-key">→ / D</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">First Step</span><span class="shortcut-key">Home</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">Last Step</span><span class="shortcut-key">End</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">Auto-Play / Pause</span><span class="shortcut-key">Space</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">Reset</span><span class="shortcut-key">Ctrl+R</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">Fit to View</span><span class="shortcut-key">Ctrl+F</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">Close Modal</span><span class="shortcut-key">Esc</span></div>
      <br>
      <div style="text-align:center;"><button class="btn" onclick="document.getElementById('shortcuts-modal').classList.remove('visible')">Close</button></div>
    </div>
  </div>

  <!-- ===== Main Application Script ===== -->
  <script type="module">
    import { CanvasManager } from './js/canvas.js';

    // ===== DOM Elements =====
    const codeEditor = document.getElementById('code-editor');
    const lineNumbers = document.getElementById('line-numbers');
    const errorBanner = document.getElementById('error-banner');
    const btnRun = document.getElementById('btn-run');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnFirst = document.getElementById('btn-first');
    const btnLast = document.getElementById('btn-last');
    const btnReset = document.getElementById('btn-reset');
    const btnAutoplay = document.getElementById('btn-autoplay');
    const btnFit = document.getElementById('btn-fit');
    const btnRealign = document.getElementById('btn-realign');
    const stepSlider = document.getElementById('step-slider');
    const stepInfo = document.getElementById('step-info');
    const speedSelect = document.getElementById('speed-select');
    const stdoutContent = document.getElementById('stdout-content');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const statusEvent = document.getElementById('status-event');
    const statusLine = document.getElementById('status-line');
    const loadingOverlay = document.getElementById('loading-overlay');
    const exampleSelect = document.getElementById('example-select');
    const stdoutHeader = document.getElementById('stdout-header');
    const stdoutPanel = document.getElementById('stdout-panel');

    // Canvas toolbar
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomReset = document.getElementById('btn-zoom-reset');
    const btnFitCanvas = document.getElementById('btn-fit-canvas');

    // ===== Initialize Canvas =====
    const canvasManager = new CanvasManager({
      viewport: document.getElementById('canvas-viewport'),
      world: document.getElementById('canvas-world'),
      connectionsLayer: document.getElementById('connections-layer'),
      nodesLayer: document.getElementById('nodes-layer'),
    });

    // ===== Application State =====
    let traceData = null;
    let currentStep = 0;
    let totalSteps = 0;
    let autoplayInterval = null;
    let isAutoPlaying = false;

    // ===== Example Code Snippets =====
    const EXAMPLES = {
      'linked-list-swap': `# Definition for singly-linked list.
class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next
        
class Solution:
    def swapPairs(self, head: ListNode | None) -> ListNode | None:
        length = 0
        current = head
        
        while current:
            length += 1
            current = current.next
        
        if length < 2:
            return head
        
        first = head
        second = first.next
        head = second

        while second:
            # try:
                temp = second.next
                second.next = first
                first.next = temp

                first = temp
                second = temp.next
            # except AttributeError:
            #     break
    
        return head
        
class List:
    def __init__ (self):
        self.head = None
        
    def append(self, element):
        newnode = ListNode(element)
        
        if self.head == None:
            self.head = newnode;
        else:
            current = self.head
            while current.next:
                current = current.next
            
            current.next = newnode
    
    def getList(self):
        return self.head
            
        
a = Solution()
list = List()

list.append(1)
list.append(2)
list.append(3)
list.append(4)

print(a.swapPairs(list.getList()))`,

      'binary-search': `def binary_search(arr, target):
    left = 0
    right = len(arr) - 1
    
    while left <= right:
        mid = (left + right) // 2
        
        if arr[mid] == target:
            return mid
        elif arr[mid] < target:
            left = mid + 1
        else:

    // ===== Load Default Example =====
    codeEditor.value = EXAMPLES['linked-list-swap'];
    updateLineNumbers();

    // ===== Line Numbers =====
    function updateLineNumbers() {
      const lines = codeEditor.value.split('\n');
      let html = '';
      for (let i = 0; i < lines.length; i++) {
        html += `<div class="line-number" data-line="${i + 1}">${i + 1}</div>`;
      }
      lineNumbers.innerHTML = html;
    }

    function highlightLine(lineNo) {
      // Clear all highlights
      lineNumbers.querySelectorAll('.line-number').forEach(el => {
        el.classList.remove('active-line');
      });
      
      if (lineNo) {
        const lineEl = lineNumbers.querySelector(`[data-line="${lineNo}"]`);
        if (lineEl) {
          lineEl.classList.add('active-line');
          // Scroll line into view
          lineEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }

    codeEditor.addEventListener('input', updateLineNumbers);
    codeEditor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = codeEditor.scrollTop;
    });

    // ===== Tab Key Support =====
    codeEditor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = codeEditor.selectionStart;
        const end = codeEditor.selectionEnd;
        codeEditor.value = codeEditor.value.substring(0, start) + '    ' + codeEditor.value.substring(end);
        codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
        updateLineNumbers();
      }
    });

    // ===== Run Code =====
    async function runCode() {
      const code = codeEditor.value.trim();
      if (!code) return;

      // Clear previous state
      resetVisualization();
      showError(null);
      setStatus('running', 'Tracing execution...');
      loadingOverlay.classList.add('visible');
      btnRun.disabled = true;

      try {
        const response = await fetch('/api/trace', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, max_steps: 1000 })
        });

        const data = await response.json();

        if (data.status === 'ok' && data.steps && data.steps.length > 0) {
          traceData = data;
          totalSteps = data.total_steps || data.steps.length;
          currentStep = 0;

          // Enable controls
          enableStepControls(true);
          stepSlider.max = totalSteps - 1;
          stepSlider.value = 0;

          // Render first step
          renderCurrentStep();
          setStatus('ok', `Traced ${totalSteps} steps`);

          // Fit to view after initial render
          setTimeout(() => canvasManager.fitToView(), 100);
        } else if (data.status === 'error') {
          const err = data.error || {};
          const errMsg = `${err.type || 'Error'}: ${err.message || 'Unknown error'}${err.line ? ` (line ${err.line})` : ''}`;
          showError(errMsg);
          setStatus('error', 'Execution error');
          if (err.line) highlightLine(err.line);
        } else {
          showError('No execution steps were generated. The code may be empty or trivial.');
          setStatus('error', 'No steps');
        }
      } catch (err) {
        showError(`Network error: ${err.message}. Is the server running?`);
        setStatus('error', 'Connection failed');
      } finally {
        loadingOverlay.classList.remove('visible');
        btnRun.disabled = false;
      }
    }

    // ===== Render Current Step =====
    function renderCurrentStep() {
      if (!traceData || !traceData.steps || currentStep < 0 || currentStep >= totalSteps) return;

      const step = traceData.steps[currentStep];
      
      // Update canvas
      canvasManager.renderStep(step);

      // Update line highlight
      highlightLine(step.line);

      // Update stdout
      stdoutContent.textContent = step.stdout || '(no output)';

      // Update step info
      stepInfo.textContent = `Step ${currentStep + 1} / ${totalSteps}`;
      stepSlider.value = currentStep;

      // Update status
      statusEvent.textContent = `Event: ${step.event || '—'} | Func: ${step.func_name || '—'}`;
      statusLine.textContent = `Line: ${step.line || '—'}`;

      // Update button states
      btnPrev.disabled = currentStep <= 0;
      btnFirst.disabled = currentStep <= 0;
      btnNext.disabled = currentStep >= totalSteps - 1;
      btnLast.disabled = currentStep >= totalSteps - 1;
    }

    // ===== Step Navigation =====
    function goToStep(n) {
      if (!traceData) return;
      currentStep = Math.max(0, Math.min(totalSteps - 1, n));
      renderCurrentStep();
    }

    function stepForward() {
      if (currentStep < totalSteps - 1) {
        currentStep++;
        renderCurrentStep();
      } else if (isAutoPlaying) {
        stopAutoPlay();
      }
    }

    function stepBackward() {
      if (currentStep > 0) {
        currentStep--;
        renderCurrentStep();
      }
    }

    // ===== Auto-Play =====
    function toggleAutoPlay() {
      if (isAutoPlaying) {
        stopAutoPlay();
      } else {
        startAutoPlay();
      }
    }

    function startAutoPlay() {
      if (!traceData || currentStep >= totalSteps - 1) return;
      isAutoPlaying = true;
      btnAutoplay.textContent = '⏸ Pause';
      btnAutoplay.classList.add('btn-run');
      const speed = parseInt(speedSelect.value);
      autoplayInterval = setInterval(() => {
        if (currentStep >= totalSteps - 1) {
          stopAutoPlay();
          return;
        }
        stepForward();
      }, speed);
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      btnAutoplay.textContent = '⏯ Auto-Play';
      btnAutoplay.classList.remove('btn-run');
      if (autoplayInterval) {
        clearInterval(autoplayInterval);
        autoplayInterval = null;
      }
    }

    // ===== Reset =====
    function resetVisualization() {
      stopAutoPlay();
      traceData = null;
      currentStep = 0;
      totalSteps = 0;
      
      // Clear canvas
      document.getElementById('nodes-layer').innerHTML = '';
      const svg = document.getElementById('connections-layer');
      svg.innerHTML = '';
      canvasManager.positionStore.clear();
      canvasManager.prevStepData = null;
      canvasManager.prevValuesMap = new Map();
      canvasManager.resetZoom();

      // Reset controls
      enableStepControls(false);
      stepSlider.max = 0;
      stepSlider.value = 0;
      stepInfo.textContent = 'Step 0 / 0';
      stdoutContent.textContent = 'No output yet.';
      highlightLine(null);
      statusEvent.textContent = '';
      statusLine.textContent = 'Line: —';
      setStatus('idle', 'Ready');
    }

    // ===== UI Helpers =====
    function enableStepControls(enabled) {
      btnPrev.disabled = !enabled;
      btnNext.disabled = !enabled;
      btnFirst.disabled = !enabled;
      btnLast.disabled = !enabled;
      btnAutoplay.disabled = !enabled;
      btnFit.disabled = !enabled;
      btnRealign.disabled = !enabled;
      stepSlider.disabled = !enabled;
    }

    function showError(msg) {
      if (msg) {
        errorBanner.textContent = msg;
        errorBanner.classList.add('visible');
      } else {
        errorBanner.textContent = '';
        errorBanner.classList.remove('visible');
      }
    }

    function setStatus(type, text) {
      statusDot.className = 'status-dot';
      if (type === 'error') statusDot.classList.add('error');
      else if (type === 'idle') statusDot.classList.add('idle');
      statusText.textContent = text;
    }

    // ===== Event Listeners =====
    btnRun.addEventListener('click', runCode);
    btnPrev.addEventListener('click', stepBackward);
    btnNext.addEventListener('click', stepForward);
    btnFirst.addEventListener('click', () => goToStep(0));
    btnLast.addEventListener('click', () => goToStep(totalSteps - 1));
    btnReset.addEventListener('click', resetVisualization);
    btnAutoplay.addEventListener('click', toggleAutoPlay);
    btnFit.addEventListener('click', () => canvasManager.fitToView());
    btnRealign.addEventListener('click', () => canvasManager.realignAutoLayout());

    stepSlider.addEventListener('input', (e) => {
      goToStep(parseInt(e.target.value));
    });

    speedSelect.addEventListener('change', () => {
      if (isAutoPlaying) {
        stopAutoPlay();
        startAutoPlay();
      }
    });

    // Canvas toolbar
    btnZoomIn.addEventListener('click', () => {
      const vp = document.getElementById('canvas-viewport');
      const rect = vp.getBoundingClientRect();
      canvasManager.zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, canvasManager.scale * 1.2);
    });

    btnZoomOut.addEventListener('click', () => {
      const vp = document.getElementById('canvas-viewport');
      const rect = vp.getBoundingClientRect();
      canvasManager.zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, canvasManager.scale * 0.8);
    });

    btnZoomReset.addEventListener('click', () => canvasManager.resetZoom());
    btnFitCanvas.addEventListener('click', () => canvasManager.fitToView());

    // Example selector
    exampleSelect.addEventListener('change', (e) => {
      const key = e.target.value;
      if (key && EXAMPLES[key]) {
        resetVisualization();
        codeEditor.value = EXAMPLES[key];
        updateLineNumbers();
        exampleSelect.value = '';
      }
    });

    // Shortcuts modal
    document.getElementById('btn-shortcuts').addEventListener('click', () => {
      document.getElementById('shortcuts-modal').classList.toggle('visible');
    });

    document.getElementById('shortcuts-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('shortcuts-modal')) {
        document.getElementById('shortcuts-modal').classList.remove('visible');
      }
    });

    // Stdout toggle
    let stdoutCollapsed = false;
    stdoutHeader.addEventListener('click', () => {
      stdoutCollapsed = !stdoutCollapsed;
      stdoutContent.style.display = stdoutCollapsed ? 'none' : 'block';
      stdoutHeader.querySelector('.stdout-toggle').textContent = stdoutCollapsed ? '▶' : '▼';
    });

    // ===== Keyboard Shortcuts =====
    document.addEventListener('keydown', (e) => {
      // Don't trigger shortcuts when typing in editor (unless Ctrl is held)
      const inEditor = document.activeElement === codeEditor;

      if (e.key === 'Escape') {
        document.getElementById('shortcuts-modal').classList.remove('visible');
        return;
      }

      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        runCode();
        return;
      }

      if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        resetVisualization();
        return;
      }

      if (e.ctrlKey && e.key === 'f') {
        if (traceData) {
          e.preventDefault();
          canvasManager.fitToView();
        }
        return;
      }

      if (inEditor) return;

      if (e.key === 'ArrowRight' || e.key === 'd') {
        e.preventDefault();
        stepForward();
      } else if (e.key === 'ArrowLeft' || e.key === 'a') {
        e.preventDefault();
        stepBackward();
      } else if (e.key === 'Home') {
        e.preventDefault();
        goToStep(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        goToStep(totalSteps - 1);
      } else if (e.key === ' ') {
        e.preventDefault();
        toggleAutoPlay();
      }
    });

    // ===== Panel Resizer =====
    const resizer = document.getElementById('resizer');
    const leftPanel = document.getElementById('left-panel');
    const workspace = document.getElementById('workspace');
    let isResizing = false;

    function updateResizerPosition() {
      resizer.style.left = leftPanel.offsetWidth - 2 + 'px';
    }
    updateResizerPosition();

    resizer.addEventListener('pointerdown', (e) => {
      isResizing = true;
      resizer.classList.add('active');
      resizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    window.addEventListener('pointermove', (e) => {
      if (!isResizing) return;
      const workspaceRect = workspace.getBoundingClientRect();
      let newWidth = e.clientX - workspaceRect.left;
      newWidth = Math.max(300, Math.min(newWidth, workspaceRect.width - 400));
      workspace.style.gridTemplateColumns = `${newWidth}px 1fr`;
      updateResizerPosition();
    });

    window.addEventListener('pointerup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
      }
    });

    // Theme info button (shows a brief tooltip)
    document.getElementById('btn-theme').addEventListener('click', () => {
      alert('🎨 Python Visualizer\n\nDark theme with interactive canvas.\n\n• Drag any element on the canvas\n• Pan by dragging the background\n• Zoom with mouse wheel\n• Use keyboard shortcuts for step navigation\n\nBuilt with zero external dependencies.');
    });

    // Initial state
    setStatus('idle', 'Ready — Press Ctrl+Enter or click Run');
  </script>
